<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coloriage">
<meta name="theme-color" content="#1d1b3a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Coloriage par numéros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Plan : bandeau encre marine avec frise de pixels, cartes « autocollant » à ombre franche, une couleur par catégorie.
   Téléphone : une colonne. Tablette : catégories en colonne à gauche, grille à droite ; en jeu, palette sur le côté en paysage. */
:root{
  color-scheme: light;
  --paper:#f3f1fa;
  --card:#ffffff;
  --ink:#1d1b3a;
  --muted:#6d6a8c;
  --line:#dcd8ee;
  --accent:#c81fd0;
  --accent-ink:#ffffff;
  --good:#1c9a5b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{height:100%;display:none;flex-direction:column}
.view.on{display:flex}
canvas{image-rendering:pixelated}

/* Écran de chargement */
#splash{position:fixed;inset:0;z-index:10;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .4s}
#splash.gone{opacity:0;pointer-events:none}
#splashCv{width:min(52vw,208px);height:auto;aspect-ratio:1;border-radius:22px;border:4px solid #fff;background:#2c2a55}
.sp-t{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.sp-bar{width:min(60vw,240px);height:10px;border-radius:10px;background:#3a3769;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#ff6fae;border-radius:10px}
.sp-s{font-weight:700;font-size:14px;color:#cfcbe8}

/* Page d'accueil : créer son joueur */
#land{position:fixed;inset:0;z-index:8;background:var(--ink);color:#fff;overflow-y:auto;display:flex;justify-content:center;padding:calc(26px + var(--st)) calc(18px + var(--sr)) calc(28px + var(--sb)) calc(18px + var(--sl))}
#land[hidden]{display:none}
.ld{width:100%;max-width:470px;display:flex;flex-direction:column;gap:18px;margin:auto 0}
.ld-top{display:flex;align-items:center;gap:14px}
#ldLogo{width:76px;height:76px;border-radius:20px;border:3px solid #fff;flex:0 0 auto}
.ld h1{font-size:30px}
.ld .tag{margin:4px 0 0;color:#cfcbe8;font-weight:700;font-size:15px}
.ldcard{background:var(--card);color:var(--ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ldcard[hidden]{display:none}
.ldcard label,.ldcard .lab{font-weight:800;font-size:14px;color:var(--muted)}
.ldcard input[type=text]{font-size:20px;padding:12px}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.av{border:3px solid var(--line);border-radius:16px;padding:0;background:#eceaf5;overflow:hidden;aspect-ratio:1}
.av canvas{width:100%;height:100%;display:block}
.av.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.btn.big{font-size:20px;padding:14px 18px;font-family:var(--display)}
.syncbox h3,#syncBox h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0}
#syncBox p{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
#syncBox .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:19px;letter-spacing:.04em;background:#eceaf5;border-radius:12px;padding:10px;text-align:center;-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}
#syncBox .err{color:#b3261e}
.ldnote{margin:0;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.players{display:flex;flex-direction:column;gap:8px}
.plb{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--card);text-align:left}
.plb canvas{width:50px;height:50px;border-radius:13px;flex:0 0 auto}
.plb b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.plb small{font-size:12px;font-weight:800;color:var(--muted)}
.plb.on{border-color:var(--accent)}
.ldfeat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;color:#e4e1f7;font-weight:700;font-size:15px}
.ldfeat li{display:flex;align-items:center;gap:10px}
.ldfeat i{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.me{flex:0 0 auto;width:42px;height:42px;border-radius:13px;border:2px solid #fff;padding:0;overflow:hidden;background:#322f61}
.me canvas{width:100%;height:100%;display:block}
.hello{display:flex;align-items:center;gap:12px}
.hello canvas{width:54px;height:54px;border-radius:15px;border:2px solid var(--ink);flex:0 0 auto}
.hello small{display:block;color:var(--muted);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}

/* Accueil : tiroir de catégories (masquable) + contenu */
#home{overflow:hidden}
.shell{flex:1;min-height:0;display:flex;position:relative}
#drawer{flex:0 0 276px;width:276px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:16px;padding:calc(14px + var(--st)) 14px calc(16px + var(--sb)) calc(14px + var(--sl));overflow-y:auto;z-index:4;position:absolute;inset:0 auto 0 0;transform:translateX(-104%);box-shadow:8px 0 30px rgba(0,0,0,.25)}
body.drawer-open #drawer{transform:none}
#scrim{position:absolute;inset:0;background:rgba(29,27,58,.55);opacity:0;pointer-events:none;z-index:3}
body.drawer-open #scrim{opacity:1;pointer-events:auto}
.dr-h{display:flex;align-items:center;gap:10px}
#logo{width:46px;height:46px;border-radius:12px;border:3px solid #fff;flex:0 0 auto}
.dr-h b{flex:1;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.02}
.icon{flex:0 0 auto;width:44px;height:44px;border-radius:13px;border:0;background:#322f61;color:#fff;display:grid;place-items:center;padding:0}
.icon svg{width:22px;height:22px;display:block}
.icon:active{transform:translateY(1px)}
.dr-l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a9a4d0;margin:2px 4px -8px}
#nav{display:flex;flex-direction:column;gap:5px}
#nav .dr-l{margin:12px 4px 3px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.md{--c:#322f61;display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:#2a2756;border:0;border-radius:16px;padding:10px;color:#fff;text-align:left;min-width:0}
.md .ic{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center}
.md .ic svg{width:20px;height:20px}
.md b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.md small{font-size:11px;font-weight:800;color:#b9b5db;font-variant-numeric:tabular-nums}
.md.on{background:var(--c)}
.md.on .ic{background:#ffffff33}
.md.on small{color:#fff}
.catrow{display:flex;align-items:center;gap:4px}
.catrow .nv{flex:1;min-width:0}
.nv.sm canvas{width:36px;height:36px;border-radius:9px}
.nv.sm b{font-size:16px}
.nv.sm small{font-size:11px}
.chev{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:0;background:#2a2756;color:#fff;display:grid;place-items:center;padding:0}
.chev svg{width:18px;height:18px}
.chev.open svg{transform:rotate(90deg)}
.subs{--c:#322f61;display:flex;flex-direction:column;gap:3px;margin:0 0 6px 24px;padding-left:10px;border-left:2px solid #3a3769}
.sb2{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;color:#e4e1f7;border-radius:10px;padding:9px 10px;font-weight:800;font-size:14px;text-align:left}
.sb2 small{color:#a9a4d0;font-size:12px;font-variant-numeric:tabular-nums}
.sb2.on{background:var(--c);color:#fff}
.sb2.on small{color:#fff}
.ltgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 6px 24px}
.ltm{height:34px;border:0;border-radius:9px;background:#2a2756;color:#fff;font-family:var(--display);font-weight:800;font-size:16px;padding:0}
.ltm.on{background:#a66a00}
@media (hover:hover){.sb2:hover,.ltm:hover,.chev:hover,.md:hover{filter:brightness(1.25)}}
.nv{--c:#322f61;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#fff;border-radius:15px;padding:7px 10px 7px 7px;text-align:left;width:100%}
.nv canvas,.nv .ic{width:42px;height:42px;border-radius:11px;flex:0 0 auto;background:var(--c);display:grid;place-items:center}
.nv .ic svg{width:22px;height:22px}
.nv b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;display:block}
.nv{padding-top:5px;padding-bottom:5px}
.nv small{font-size:12px;font-weight:800;color:#b9b5db;font-variant-numeric:tabular-nums}
.nv.on{background:var(--c)}
.nv.on small{color:#fff}
.nv.on canvas,.nv.on .ic{box-shadow:0 0 0 2px #fff}
.dr-f{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.overall{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#cfcbe8;font-variant-numeric:tabular-nums}
.overall .bar{background:#3a3769;height:8px}
.overall .bar i{background:#ff6fae}
.content{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.content>*{flex:0 0 auto}
.appbar{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--st)) calc(14px + var(--sr)) 10px calc(14px + var(--sl))}
.ab-t{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;color:#fff;cursor:pointer;font-family:inherit;background:#322f61;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pix{height:8px;background:repeating-linear-gradient(90deg,#d6336c 0 10px,#3b5bdb 10px 20px,#e8590c 20px 30px,#2f9e44 30px 40px,#0c8599 40px 50px,#7048e8 50px 60px);position:sticky;top:calc(64px + var(--st));z-index:2}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 #8d1493}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d1493}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.small{padding:8px 12px;border-radius:12px;font-size:14px}
.btn.pink{background:#ff6fae;color:var(--ink);box-shadow:0 3px 0 #b83a78}
.btn.pink:active{box-shadow:0 1px 0 #b83a78}
.btn.line{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink);border:2px solid var(--ink)}
.btn.line:active{box-shadow:0 1px 0 var(--ink)}

.page{max-width:1080px;width:100%;margin:0 auto;padding:20px calc(16px + var(--sr)) calc(40px + var(--sb)) calc(16px + var(--sl));display:flex;flex-direction:column;gap:24px}
.block{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.1;margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.feature{--c:var(--accent);background:var(--card);border:2px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:12px;display:grid;grid-template-columns:minmax(104px,34%) 1fr;gap:14px;align-items:center;cursor:pointer}
.feature canvas{width:100%;aspect-ratio:1;border-radius:14px;background:#eceaf5;display:block}
.feature .fx{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start}
.feature h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;margin:0}
.feature .bar{width:100%;height:8px}
.feature .inf{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.quick .btn{flex:1 1 150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.tile{--c:#888;background:var(--c);color:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:9px;display:flex;flex-direction:column;gap:7px;text-align:left}
.tile canvas{width:100%;aspect-ratio:1;border-radius:13px;background:#ffffff33;display:block}
.tile b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05}
.tile small{font-size:12px;font-weight:800;opacity:.92;font-variant-numeric:tabular-nums}
.tile .bar{background:#ffffff4d}
.tile .bar i{background:#fff}
.tile:active,.feature:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sec{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.sec .lh{display:flex;align-items:center;gap:10px;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fl{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--muted)}
.fl.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fl.sb{font-size:15px;padding:8px 14px;border-color:var(--ink);color:var(--ink)}
.fl.sb.on{background:var(--c);border-color:var(--ink);color:#fff}
.rowscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rowscroll::-webkit-scrollbar{display:none}
.rowscroll .card{flex:0 0 138px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px}
.card{--c:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:7px;text-align:left;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.th{position:relative}
.th canvas{width:100%;aspect-ratio:1;border-radius:11px;background:#eceaf5;display:block}
.badge{position:absolute;right:6px;top:6px;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:var(--ink);color:#fff;font-variant-numeric:tabular-nums}
.card.done .badge{background:var(--good)}
.card .nm{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.card.done .bar i{background:var(--good)}
.del{border:0;background:none;color:var(--muted);font-weight:800;font-size:12px;padding:2px 0;text-decoration:underline}
.empty{grid-column:1/-1;color:var(--muted);font-weight:700;padding:12px 0;margin:0}
@media (hover:hover){.card:hover,.tile:hover,.feature:hover{transform:translateY(-2px)} .nv:hover{background:#322f61} .nv.on:hover{background:var(--c)}}
@media (min-width:700px){
  .ab-t{font-size:26px}
  .page{gap:28px;padding-top:26px}
  .feature{grid-template-columns:200px 1fr;gap:22px;padding:16px}
  .feature h3{font-size:32px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px}
  .rowscroll .card{flex-basis:164px}
  .rowscroll{margin:0;padding:2px 2px 8px}
}
@media (min-width:900px){
  #drawer{position:static;transform:none;box-shadow:none}
  body.drawer-off #drawer{display:none}
  #scrim{display:none}
  #drawerClose{display:none}
}
@media (prefers-reduced-motion:no-preference){#drawer{transition:transform .22s ease} #scrim{transition:opacity .22s}}

.letters{display:flex;flex-wrap:wrap;gap:7px}
.lt{min-width:44px;height:44px;padding:0 10px;border:2px solid var(--ink);background:var(--card);border-radius:13px;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--ink)}
.lt.on{background:#a66a00;color:#fff}
.lt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.grid.wide .th canvas{aspect-ratio:2/1}
/* Mode Monde */
.wbanner{background:var(--ink);color:#fff;border:0;border-radius:22px;box-shadow:0 5px 0 #0d0c20;padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;text-align:left;width:100%}
.wbanner:active,.planet:active{transform:translateY(3px);box-shadow:0 2px 0 #0d0c20}
.wbanner .wt{flex:1 1 170px;min-width:0}
.wbanner b,.planet b,.phead b{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;display:block}
.wbanner small,.planet small,.phead small{font-size:13px;font-weight:700;color:#cfcbe8;display:block}
.wbanner .pl{display:flex;gap:5px}
.wbanner .pl canvas{width:34px;height:34px}
.whead{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.whead p{flex:1 1 240px;margin:0;color:var(--muted);font-weight:700;font-size:14px;max-width:62ch}
.wscore b{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.planets{display:flex;flex-direction:column;gap:16px}
.planet,.phead{--c:#ff6fae;display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;background:var(--ink);color:#fff;border:0;border-radius:24px;box-shadow:0 5px 0 #0d0c20;padding:14px 16px;text-align:left;width:100%;max-width:640px}
.planet:nth-child(even){align-self:flex-end}
.planet canvas,.phead canvas{width:84px;height:84px;display:block}
.planet.lock b,.planet.lock small{opacity:.7}
.ptx{display:flex;flex-direction:column;gap:5px;min-width:0}
.ptx .bar{background:#3a3769;height:8px}
.pstate{align-self:flex-start;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:#3a3769;color:#fff;font-variant-numeric:tabular-nums}
.planet.full .pstate{background:var(--good)}
.ppts{font-variant-numeric:tabular-nums}
.phead{max-width:none;box-shadow:none}
@media (min-width:700px){.planet,.phead{grid-template-columns:110px 1fr} .planet canvas,.phead canvas{width:110px;height:110px}}

/* Jeu */
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) calc(12px + var(--sr)) 10px calc(12px + var(--sl));background:var(--card);border-bottom:2px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.btn.sq{padding:7px 9px;display:grid;place-items:center}
.btn.sq svg{width:22px;height:22px;display:block}
.top{gap:8px}
.top .ttl b{font-family:var(--display);font-size:19px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;min-width:0;position:relative;touch-action:none;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px,var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}

<script>
"use strict";
const $ = id => document.getElementById(id);
const CH = "0123456789abcdefghijklmnopqrstuvwxyz";
/* ---------- Sauvegarde en ligne (Supabase, projet scan-prix) ----------
   Un « code de famille » sert de clé : le serveur n'en garde que l'empreinte.
   La clé ci-dessous est la clé publique du projet, prévue pour être dans le navigateur. */
const SB_URL = "https://vfikxkdadiqkducklewv.supabase.co", SB_KEY = "sb_publishable_7ChQQ1PKLuvBgo5qcrvFhg_CKlSwK6t";
const DEVICE_KEYS = ["cpn.sync","cpn.mute","cpn.drawerOff","cpn.user"];
const syncable = k => (k.startsWith("cpn.") || k.startsWith("cpn@")) && !DEVICE_KEYS.includes(k);
let sync = null, syncTimer = 0, syncBusy = false, syncGen = 0, syncErr = "";
try{ sync = JSON.parse(localStorage.getItem("cpn.sync") || "null"); }catch(e){}
const saveSync = () => { try{ if(sync) localStorage.setItem("cpn.sync", JSON.stringify(sync)); else localStorage.removeItem("cpn.sync"); }catch(e){} };
function markDirty(){ if(!sync) return; syncGen++; if(!sync.dirty){ sync.dirty = true; saveSync(); } clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 6000); }
function snapshot(){ const o = {}; try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(syncable(k)) o[k] = localStorage.getItem(k); } }catch(e){} return o; }
async function rpc(fn, body){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn, {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer "+SB_KEY}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function syncPush(){
  if(!sync || syncBusy) return; syncBusy = true; clearTimeout(syncTimer); const gen = syncGen;
  try{ const at = await rpc("coloriage_put", {p_code:sync.code, p_data:{keys:snapshot()}}); sync.at = at; sync.ok = Date.now(); if(gen===syncGen) sync.dirty = false; saveSync(); syncErr = ""; }
  catch(e){ syncErr = "net"; }
  syncBusy = false; if(typeof renderSync === "function") renderSync();
  if(sync && sync.dirty && !syncErr) syncTimer = setTimeout(syncPush, 6000);
}
/* Fusion quand les deux appareils ont changé : on garde toutes les cases coloriées des deux côtés */
function unionMerge(local, remote){
  const out = Object.assign({}, local);
  for(const k in remote){
    const lv = local[k], rv = remote[k];
    if(lv === undefined){ out[k] = rv; continue; }
    if(/^cpn(@[^.]+)?\.pm?\./.test(k) && lv.length===rv.length){ let m = ""; for(let i=0;i<lv.length;i++) m += (lv[i]==="1" || rv[i]==="1") ? "1" : lv[i]; out[k] = m; continue; }
    if(k === "cpn.users"){ try{ const a = JSON.parse(lv), b = JSON.parse(rv); b.forEach(u=>{ if(!a.some(x=>x.id===u.id)) a.push(u); }); out[k] = JSON.stringify(a); }catch(e){} }
  }
  return out;
}
function writeAll(keys, replace){
  try{
    if(replace){ const gone = []; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(syncable(k) && !(k in keys)) gone.push(k); } gone.forEach(k=>localStorage.removeItem(k)); }
    for(const k in keys) if(syncable(k)) localStorage.setItem(k, keys[k]);
  }catch(e){}
}
function fixCurrentUser(){
  try{ const us = JSON.parse(localStorage.getItem("cpn.users") || "[]"), cu = JSON.parse(localStorage.getItem("cpn.user") || '""'); if(!us.some(u=>u.id===cu)) localStorage.setItem("cpn.user", JSON.stringify(us[0] ? us[0].id : "")); }catch(e){}
}
async function syncStart(){
  if(!sync) return;
  try{
    const res = await rpc("coloriage_get", {p_code:sync.code}); syncErr = "";
    if(!res){ await syncPush(); return; }
    if(res.updated_at === sync.at){ if(sync.dirty) await syncPush(); else { sync.ok = Date.now(); saveSync(); } return; }
    const remote = (res.data && res.data.keys) || {};
    if(sync.dirty){ writeAll(unionMerge(snapshot(), remote), false); sync.at = res.updated_at; saveSync(); await syncPush(); }
    else { writeAll(remote, true); sync.at = res.updated_at; sync.ok = Date.now(); saveSync(); }
    fixCurrentUser(); location.reload();
  }catch(e){ syncErr = "net"; if(typeof renderSync === "function") renderSync(); }
}
const CODE_AB = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const normCode = c => String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const showCode = c => c.replace(/(.{4})(?=.)/g,"$1-");
function newCode(){ const a = new Uint8Array(16); (window.crypto||window.msCrypto).getRandomValues(a); return [...a].map(v=>CODE_AB[v%32]).join(""); }

const RAW = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} if(syncable(k)) markDirty(); },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} if(syncable(k)) markDirty(); }
};
/* Joueurs : le premier garde les clés d'origine, les suivants ont leur propre espace */
let users = RAW.get("cpn.users", []); if(!Array.isArray(users)) users = [];
let me = users.find(u=>u.id===RAW.get("cpn.user", "")) || null;
const SHARED = ["cpn.users","cpn.user","cpn.mute","cpn.drawerOff"];
const keyOf = k => (me && me.pfx && !SHARED.includes(k)) ? k.replace(/^cpn\./, "cpn@"+me.pfx+".") : k;

/* Générateur à partir de couleurs : la palette se construit toute seule */
function genHex(id, name, cat, cols, rows, fn){
  const palette = []; let cells = "";
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const h = fn(x+.5, y+.5); let i = palette.indexOf(h);
    if(i<0){ i = palette.length; palette.push(h); }
    cells += CH[i];
  }
  return {id, name, cat, cols, rows, palette, cells};
}

    if(H(x-8,y-12.4)<1.05 || H(x-18,y-12.4)<1.05) return cheek;
    if(o.spots) for(const [sx,sy,sr] of SP) if(H(x-sx,y-sy)<sr) return light;
    return o.c;
  }
  function back(x,y){
    if(o.bg==="uni") return o.bgc || "#fff3bf";
    if(o.bg==="nuit"){
      const h = Math.sin(Math.floor(x/k)*12.9898+Math.floor(y/k)*78.233)*43758.5453;
      if(y>=23.6) return "#0b132b";
      return h-Math.floor(h)>.95 ? "#7de2d1" : "#14213d";
    }
    if(y>=23.6) return "#f2d58a";
    if(y>15 && (Math.abs(x-2.2-Math.sin(y*1.3)*.6)<.7 || Math.abs(x-23.8-Math.sin(y*1.3+2)*.6)<.7)) return "#2f9e44";
    for(const [bx,by,br] of [[3.5,6,1],[5.2,3,.7],[22,8,.9],[20.5,2.5,.6]]) if(H(x-bx,y-by)<br) return "#c9efff";
    if(o.bg==="rayons") return y>13 ? "#2b8fd0" : "#7cc6f2";
    return "#3aa7e0";
  }
  BUILTIN.push(genHex("O_"+id, name, "pieuvres", N, N, (px,py)=>{
    const x = px*k, y = py*k;
    const a = accessory(x,y); if(a) return a;
    if(!inC(px,py)) return back(x,y);
    if(edge(inC,px,py)) return dark;
    if(head(x,y)) return face(x,y);
    const p = tent(x,y), base = o.rainbow ? RB[p[4]%RB.length] : o.c;
    return p[3]>.7 ? mix(base,"#ffffff",.42) : base;
  }));
}

/* ----- Atelier : dessins composés de formes superposées ----- */
function Pt(N, bg){
  const g = new Array(N*N).fill(bg), sub = new Uint8Array(N*N); let on = false;
  const put = (test, col) => { for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const px=x+.5, py=y+.5; if(test(px,py)){ g[y*N+x] = typeof col==="function" ? col(px,py) : col; sub[y*N+x] = on?1:0; } } };
  const P = {
    N, f: put,
    c:(cx,cy,r,col)=>put((x,y)=>H(x-cx,y-cy)<r,col),
    e:(cx,cy,rx,ry,col)=>put((x,y)=>((x-cx)/rx)**2+((y-cy)/ry)**2<1,col),
    r:(x0,y0,x1,y1,col)=>put((x,y)=>x>=x0&&x<x1&&y>=y0&&y<y1,col),
    p:(pts,col)=>put((x,y)=>pip(pts,x,y),col),
    path:(pts,w0,w1,col)=>{
      const S=[], seg=[]; let tot=0, acc=0;
      for(let i=1;i<pts.length;i++){ const d=H(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(d); tot+=d; }
      for(let i=1;i<pts.length;i++){ const n=Math.max(2,Math.ceil(seg[i-1]*3)); for(let k=0;k<=n;k++){ const t=k/n, u=(acc+seg[i-1]*t)/tot; S.push([pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t, w0+(w1-w0)*u]); } acc+=seg[i-1]; }
      put((x,y)=>S.some(s=>H(x-s[0],y-s[1])<s[2]),col);
    },
    l:(x0,y0,x1,y1,w,col)=>P.path([[x0,y0],[x1,y1]],w,w,col),
    d:(list,r,col)=>list.forEach(q=>P.c(q[0],q[1],r,col)),
    s:(x,y,col)=>{ if(x>=0&&y>=0&&x<N&&y<N){ g[y*N+x]=col; sub[y*N+x]=on?1:0; } },
    x:(cx,cy,r)=>{ const o=on; on=false; put((x,y)=>H(x-cx,y-cy)<r,bg); on=o; },
    fg:()=>{ on=true; },
    o:(col)=>{ const add=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const i=y*N+x; if(sub[i]) continue; if((x>0&&sub[i-1])||(x<N-1&&sub[i+1])||(y>0&&sub[i-N])||(y<N-1&&sub[i+N])) add.push(i); } add.forEach(i=>{ g[i]=col; sub[i]=1; }); },
    out:(id,name,cat)=>{ const palette=[]; let cells=""; for(const h of g){ let i=palette.indexOf(h); if(i<0){ i=palette.length; palette.push(h); } cells+=CH[i]; } return {id,name,cat,cols:N,rows:N,palette,cells}; }
  };
  return P;
}
function D(id, name, cat, bg, fn, sub){ const P = Pt(22, bg); fn(P); const d = P.out("W_"+id, name, cat); if(sub) d.sub = sub; BUILTIN.push(d); }
const eye = (P,x,y,r) => { P.c(x,y,r||1.2,"#ffffff"); P.c(x+.2,y+.1,(r||1.2)*.55,INK); };
const smile = (P,cx,y,col) => { P.s(cx-2,y,col); P.s(cx-1,y+1,col); P.s(cx,y+1,col); P.s(cx+1,y,col); };
const dots = (P,list,col) => list.forEach(q=>P.s(q[0],q[1],col));

const sea = P => { P.r(0,12,22,22,"#2b8fd0"); P.r(0,20,22,22,"#f2d58a"); P.c(2.5,4.5,1,"#c9efff"); dots(P,[[19,2],[17,5],[1,8]],"#c9efff"); };
function fish(id, name, o){
  D(id, name, o.cat || "eau", o.bg || "#5bbcec", P => {
    if(o.bg) dots(P,[[2,3],[7,18],[19,16],[16,2],[3,13]],o.dot || "#3a5a8c"); else sea(P);
    P.fg();
    const rx=o.rx||6.5, ry=o.ry||4.5, body=(x,y)=>((x-10)/rx)**2+((y-11)/ry)**2<1;
    P.p([[10+rx-1.5,11],[20.5,6.5],[19,11],[20.5,15.5]],o.fin);
    P.p([[7,11-ry+1],[11.5,11-ry-2.6],[13.5,11-ry+1.2]],o.fin);
    P.p([[9,11+ry-1],[11,11+ry+2],[12.5,11+ry-1]],o.fin);
    P.f(body,o.c);
    if(o.pat==="stripes") P.f((x,y)=>body(x,y)&&(Math.abs(x-9.5)<.9||Math.abs(x-13)<.9),o.s);
    if(o.pat==="spots") [[9,9],[12,12.5],[13,9.5],[9.5,13.5],[6.5,12.5]].forEach(q=>P.f((x,y)=>body(x,y)&&H(x-q[0],y-q[1])<1,o.s));
    if(o.pat==="belly") P.f((x,y)=>body(x,y)&&y>12,o.s);
    eye(P,6,10,1.3);
    if(o.extra) o.extra(P);
    P.o(mix(o.c,INK,.62));
  }, o.sub);
}

function flame(P,cx,by,k){
  P.c(cx,by-6*k,6*k,"#e03131"); P.p([[cx-5.6*k,by-8*k],[cx,by-19*k],[cx+5.6*k,by-8*k]],"#e03131");
  P.c(cx,by-5*k,4.3*k,"#ff8c42"); P.p([[cx-4*k,by-6.5*k],[cx,by-14*k],[cx+4*k,by-6.5*k]],"#ff8c42");
  P.c(cx,by-3.6*k,2.6*k,"#ffd43b"); P.p([[cx-2.3*k,by-4.5*k],[cx,by-9.5*k],[cx+2.3*k,by-4.5*k]],"#ffd43b");
}

function robot(id, name, o){
  D(id, name, "cosmos", o.bg, P => {
    P.fg(); P.l(11,4.5,11,2,.45,"#868e96"); P.c(11,1.6,1.1,o.light);
    P.r(3,8,5,12,o.acc); P.r(17,8,19,12,o.acc);
    if(o.round) P.e(11,10,6.6,5.9,o.c); else P.r(5,4.5,17,15,o.c);
    P.c(8,9,1.9,"#ffffff"); P.c(14,9,1.9,"#ffffff"); P.c(8,9,.9,o.eye); P.c(14,9,.9,o.eye);
    P.r(8,12,14,13.5,INK); P.s(9,12,"#ffffff"); P.s(12,12,"#ffffff");
    P.r(9.5,15,12.5,16.5,"#868e96"); P.r(4.5,16.5,17.5,22,o.body); P.r(8,18,14,21,o.acc); P.s(9,19,"#e03131"); P.s(12,19,"#69db7c");
    P.o("#343a40");
  });
}

function xtree(id, name, o){
  XM(id, name, "sapins", o.bg, P => {
    if(o.deco) o.deco(P); if(o.ground) P.r(0,19.6,22,22,o.ground);
    P.fg(); if(o.pot) P.p([[7.6,17.5],[14.4,17.5],[13.4,21.4],[8.6,21.4]],"#c2410c"); else P.r(10,17,12,20,"#8b5a2b");
    const g = o.g || ["#2b8a3e","#37b24d","#51cf66"];
    P.p([[4,17.6],[11,9],[18,17.6]],g[0]); P.p([[5.5,12.6],[11,5],[16.5,12.6]],g[1]); P.p([[7,8.2],[11,3],[15,8.2]],g[2]);
    o.dec(P); if(o.star!==null) P.p(starPts(11,2.6,2.3,1),o.star||"#ffd43b"); P.o(o.out||"#0b3d1c");
  });
}

/* Une couleur par lettre, jamais deux fois la même dans un mot */
const WCOLS = ["#e03131","#f76707","#f0b400","#2f9e44","#0c8599","#1c7ed6","#5f3dc4","#c2255c","#8b5a2b","#12b886"];
function wordDrawing(w, letter, hue){
  const L = [...w].map(ch=>{ const n = ch.normalize("NFD"); return {g: FONT[n[0]].replace(/ /g,""), a: n[1] && ACCENTS[n[1]] ? ACCENTS[n[1]].replace(/ /g,"") : null, c: n[1]==="\u0327"}; });
  const S = 2, top = L.some(l=>l.a) ? 2 : 0, bot = L.some(l=>l.c) ? 1 : 0, cols = L.length*5*S+(L.length-1)*2+2, rows = (7+top+bot)*S+2;
  const at = (x,y) => {            // 0 = vide, sinon numéro de la lettre (1, 2, 3…)
    const xx = x-1, k = Math.floor(xx/12), gx = Math.floor((xx-k*12)/S), gy = Math.floor((y-1)/S);
    if(xx<0 || k<0 || k>=L.length || gx<0 || gx>4 || y<1 || gy<0 || gy>=7+top+bot) return 0;
    const l = L[k], lit = gy<top ? (l.a && l.a[gy*5+gx]==="1") : gy>=7+top ? (l.c && gx===2) : l.g[(gy-top)*5+gx]==="1";
    return lit ? k+1 : 0;
  };
  let cells = "";
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const v = at(x,y);
    cells += v ? CH[v-1] : ".";
  }
  const name = w;
  return {id:"M_"+w, name, cat:"mots", letter, cols, rows, palette: L.map((l,k)=>WCOLS[(hue+k)%WCOLS.length]), cells};
}

function pictureWord(w, src){
  const L = [...w].map(ch=>{ const n = ch.normalize("NFD"); return {g: FONT[n[0]].replace(/ /g,""), a: n[1] && ACCENTS[n[1]] ? ACCENTS[n[1]].replace(/ /g,"") : null, c: n[1]==="̧"}; });
  const top = L.some(l=>l.a) ? 2 : 0, bot = L.some(l=>l.c) ? 1 : 0, ww = L.length*6-1;
  const cols = Math.max(src.cols, ww+2), ox = Math.floor((cols-src.cols)/2), wx = Math.floor((cols-ww)/2), wy = src.rows+1, rows = wy+top+7+bot+1;
  const palette = src.palette.concat(L.map((l,k)=>WCOLS[(k*3+w.length)%WCOLS.length]));
  let cells = "";
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    if(y<src.rows){ const sx = x-ox; cells += (sx>=0 && sx<src.cols) ? src.cells[y*src.cols+sx] : "."; continue; }
    const xx = x-wx, yy = y-wy, k = Math.floor(xx/6), gx = xx-k*6; let ch = ".";
    if(xx>=0 && k<L.length && gx<5 && yy>=0 && yy<top+7+bot){ const l = L[k], lit = yy<top ? (l.a && l.a[yy*5+gx]==="1") : yy>=top+7 ? (l.c && gx===2) : l.g[(yy-top)*5+gx]==="1"; if(lit) ch = CH[src.palette.length+k]; }
    cells += ch;
  }
  return {id:"I_"+w, name:w, word:w, cat:"imagier", cols, rows, palette, cells};
}
Object.keys(IMG_WORDS).forEach(w=>{ const src = BUILTIN.find(d=>d.id===IMG_WORDS[w]); if(src && src.palette.length+[...w].length<=CH.length) BUILTIN.push(pictureWord(w, src)); });

/* ----- Calcul : les cases montrent une opération au lieu du numéro ----- */
let mathMode = null;
const MATH_SETS = [
  ["add","Additions","Chaque case cache une addition.",["F_cercle","F_carre","F_triangle","F_etoile","F_losange","F_rectangle","F_ovale","F_hexagone","F_lune"]],
  ["sub","Soustractions","Chaque case cache une soustraction.",["N_0","N_1","N_2","N_3","N_4","N_5","N_6","N_7","N_8","N_9"]],
  ["mix","Additions et soustractions","Les deux sont mélangées.",["coeur","O_bebe","L_A","L_B","L_C","L_D","L_E","L_F"]]
];
function exprOf(i, n){
  const h = (Math.imul(i+7, 2654435761)>>>0) % 97;
  if(mathMode==="add" || (mathMode==="mix" && h%2)){ const a = h%(n+1); return a+"+"+(n-a); }
  const b = h % Math.max(1, 11-n); return (n+b)+"−"+b;
}

const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function planetArt(cv, p, locked, seed){
  cv.width = cv.height = 16; const c = cv.getContext("2d");
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    const d = H(x+.5-8, y+.5-8); if(d >= 7.6) continue;
    const v = Math.sin((y+.5)*.85+Math.sin((x+.5)*.6+seed)*1.4+seed);
    let col = locked ? (v>.35 ? "#8a87a8" : v<-.4 ? "#5f5c80" : "#737095") : (v>.35 ? p.art[2] : v<-.4 ? p.art[1] : p.art[0]);
    if(H(x+.5-5.5, y+.5-5.5) > 7.4) col = mix(col, INK, .35);
    if(d > 6.6) col = mix(col, INK, .25);
    c.fillStyle = col; c.fillRect(x, y, 1, 1);

function stats(d, done){
  let tot=0, ok=0;

function drawThumb(cv, d, done, full){
  const wideT = d.cat==="mots" && cv.dataset.wide;
  const k = Math.max(1, Math.floor(wideT ? Math.min(480/d.cols, 240/d.rows) : 240/Math.max(d.cols,d.rows)));
  const side = wideT ? Math.max(d.cols*k, d.rows*k*2) : Math.max(d.cols,d.rows)*k, sideH = wideT ? side/2 : side;
  cv.width = side; cv.height = sideH;
  const c = cv.getContext("2d"), ox = Math.floor((side-d.cols*k)/2), oy = Math.floor((sideH-d.rows*k)/2);
  for(let i=0;i<d.cells.length;i++){
    const ch = d.cells[i]; if(ch === ".") continue;
    const col = d.palette[CH.indexOf(ch)];
    c.fillStyle = (full || done[i]) ? col : greyOf(col);
    c.fillRect(ox+(i%d.cols)*k, oy+Math.floor(i/d.cols)*k, k, k);
  }
}

}

function convert(){
  if(!srcImg) return;
  const size = +$("isize").value, k = +$("icol").value;
  const r = srcImg.naturalWidth/srcImg.naturalHeight;
  const cols = r>=1 ? size : Math.max(4, Math.round(size*r)), rows = r>=1 ? Math.max(4, Math.round(size/r)) : size;
  const t = document.createElement("canvas"); t.width = cols; t.height = rows;
  const c = t.getContext("2d", {willReadFrequently:true});
  c.imageSmoothingQuality = "high"; c.drawImage(srcImg, 0, 0, cols, rows);
  const px = c.getImageData(0,0,cols,rows).data, n = cols*rows;
  const pix = []; for(let i=0;i<n;i++) if(px[i*4+3]>=128) pix.push(i);
  if(!pix.length) return;
  // k-moyennes, graines réparties selon la luminosité
  const sorted = pix.slice().sort((a,b)=>(px[a*4]*.299+px[a*4+1]*.587+px[a*4+2]*.114)-(px[b*4]*.299+px[b*4+1]*.587+px[b*4+2]*.114));

  const asg = new Int16Array(n).fill(-1);
  for(let it=0;it<10;it++){
    const sum = cen.map(()=>[0,0,0,0]);
    for(const i of pix){
      let b=0, bd=1e12;
      for(let j=0;j<cen.length;j++){ const dr=px[i*4]-cen[j][0], dg=px[i*4+1]-cen[j][1], db=px[i*4+2]-cen[j][2], d=dr*dr*.3+dg*dg*.59+db*db*.11; if(d<bd){ bd=d; b=j; } }
      asg[i] = b; const s = sum[b]; s[0]+=px[i*4]; s[1]+=px[i*4+1]; s[2]+=px[i*4+2]; s[3]++;
    }
    cen = cen.map((cc,j)=> sum[j][3] ? [sum[j][0]/sum[j][3], sum[j][1]/sum[j][3], sum[j][2]/sum[j][3]] : cc);
  }
  const used = [...new Set(pix.map(i=>asg[i]))];
  const hex = v => Math.round(v).toString(16).padStart(2,"0");
  const palette = [], map = {};
  for(const j of used){ const h = "#"+hex(cen[j][0])+hex(cen[j][1])+hex(cen[j][2]); let at = palette.indexOf(h); if(at<0){ at = palette.length; palette.push(h); } map[j] = at; }
  let cells = ""; for(let i=0;i<n;i++) cells += asg[i]<0 ? "." : CH[map[asg[i]]];
  pending = {cols, rows, palette, cells};
  const pv = $("prev"), z = Math.max(1, Math.floor(360/Math.max(cols,rows)));
  pv.width = cols*z; pv.height = rows*z; const pc = pv.getContext("2d");
  for(let i=0;i<n;i++){ if(asg[i]<0) continue; pc.fillStyle = palette[map[asg[i]]]; pc.fillRect((i%cols)*z, Math.floor(i/cols)*z, z, z); }
}

const AVATARS = ["O_rose","O_pirate","O_reine","O_lunettes","chat","W_robot1","W_alien","W_dragon","W_pingouin","W_ours","W_abeille","W_tortue"];
const avatarOf = u => BUILTIN.find(d=>d.id===(u && u.av)) || BUILTIN.find(d=>d.id==="O_rose");
let ldMode = "create", ldAv = AVATARS[0];
function sessFlag(set){ try{ if(set) sessionStorage.setItem("cpn.chosen","1"); return sessionStorage.getItem("cpn.chosen")==="1"; }catch(e){ return false; } }
function showLand(mode){
  ldMode = mode; const choose = mode==="choose";
  $("land").hidden = false; $("ldChoose").hidden = !choose; $("ldForm").hidden = choose; $("ldErr").hidden = true;
  $("syncBox").hidden = mode==="edit" || (mode==="create" && users.length>0); renderSync();
  drawThumb($("ldLogo"), BUILTIN.find(d=>d.id==="O_rose"), null, true);
  $("ldTitle").textContent = choose ? "Qui joue ?" : mode==="edit" ? "Mon profil" : "Coloriage par numéros";
  $("ldTag").textContent = choose ? "Choisis ton joueur pour retrouver tes dessins." : mode==="edit" ? "Change ton prénom ou ton avatar." : users.length ? "Crée un nouveau joueur : il aura ses propres dessins et ses propres points." : "Crée ton joueur, choisis ton avatar, puis commence à colorier.";
  const ft = $("ldFeat"); ft.textContent = "";
  if(mode==="create") [["#ff6fae",`${all().length} dessins à colorier, des pieuvres aux mots en français`],["#4dabf7","Six planètes à compléter pour gagner des points"],["#ffd43b","Un mode libre avec tes couleurs et des dégradés"]].forEach(([c,t])=>{ const li = el("li"), sq = el("i"); sq.style.background = c; li.append(sq, document.createTextNode(t)); ft.appendChild(li); });
  if(choose){
    const pl = $("ldPlayers"); pl.textContent = "";
    for(const u of users){
      const b = el("button","plb" + (me && u.id===me.id ? " on" : "")); b.type = "button";
      const c = el("canvas"); drawThumb(c, avatarOf(u), null, true);
      const t = el("span"); t.append(el("b",null,u.name), el("small",null, me && u.id===me.id ? "Joueur actuel" : "Toucher pour jouer"));
      b.append(c, t);
      b.onclick = () => { if(me && u.id===me.id){ $("land").hidden = true; return; } RAW.set("cpn.user", u.id); sessFlag(true); location.reload(); };
      pl.appendChild(b);
    }
    $("ldEdit").hidden = !me;
    return;
  }
  $("ldName").value = mode==="edit" && me ? me.name : "";
  ldAv = mode==="edit" && me ? me.av : AVATARS[users.length % AVATARS.length];
  $("ldGo").textContent = mode==="edit" ? "Enregistrer" : "Commencer";
  $("ldBack").hidden = !me; $("ldHave").hidden = users.length>0 || !!sync;
  const g = $("ldAv"); g.textContent = "";
  const pts = mode==="edit" ? lastScore : 0;
  AVATARS.map(id=>[id,0]).concat(AV_LOCKED).forEach(([id,cost])=>{
    const d = BUILTIN.find(x=>x.id===id); if(!d) return; const locked = pts<cost;
    const b = el("button","av" + (id===ldAv ? " on" : "") + (locked ? " lock" : "")); b.type = "button"; b.disabled = locked;
    b.setAttribute("aria-label", locked ? `Avatar ${d.name}, à débloquer avec ${cost} points` : "Avatar "+d.name); b.setAttribute("aria-pressed", id===ldAv);
    const c = el("canvas"); drawThumb(c, d, null, true); b.appendChild(c); if(locked) b.appendChild(el("span","cost","◆ "+fmt(cost)));
    b.onclick = () => { ldAv = id; g.querySelectorAll(".av").forEach(x=>{ x.classList.toggle("on", x===b); x.setAttribute("aria-pressed", x===b); }); };
    g.appendChild(b);
  });
}
$("ldForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("ldName").value.trim().slice(0,14);
  if(!name){ $("ldErr").hidden = false; $("ldName").focus(); return; }
  if(ldMode==="edit" && me){ me.name = name; me.av = ldAv; RAW.set("cpn.users", users); $("land").hidden = true; renderGallery(); return; }
  const id = "u"+Date.now().toString(36), u = {id, name, av: ldAv, pfx: users.length ? id : ""};
  users.push(u); RAW.set("cpn.users", users); RAW.set("cpn.user", id); sessFlag(true);
  if(u.pfx){ location.reload(); return; }      /* nouveau joueur : on recharge avec son espace à lui */
  me = u; $("land").hidden = true; renderGallery();
});
$("ldBack").onclick = () => showLand("choose");
$("ldHave").onclick = () => { syncAsk = true; renderSync(); $("syncBox").scrollIntoView({block:"center"}); const i = $("syncIn"); if(i) i.focus(); };
$("ldEdit").onclick = () => showLand("edit");
$("ldNew").onclick = () => showLand("create");
$("ldClose").onclick = () => { $("land").hidden = true; };
$("meBtn").onclick = () => showLand(me ? "choose" : "create");
$("ovPill").onclick = () => setPage("etoiles");

renderGallery();
/* Jeu hors ligne : seulement sur le vrai site, pas dans un aperçu intégré */
try{ if("serviceWorker" in navigator && location.protocol==="https:" && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
if(!me) showLand("create"); else if(users.length>1 && !sessFlag(false)) showLand("choose");
syncStart();

/* ---------- Écran de chargement ---------- */
(function(){
  const sp = $("splash"), d = BUILTIN.find(x=>x.id==="O_rose");
  const lg = $("logo"); drawThumb(lg, d, null, true);
  const cvs = $("splashCv"), c = cvs.getContext("2d"), k = cvs.width/d.cols;
  const cell = (i, col) => { c.fillStyle = col; c.fillRect((i%d.cols)*k, Math.floor(i/d.cols)*k, k, k); };
  const order = [...d.cells].map((ch,i)=>i).sort((a,b)=>CH.indexOf(d.cells[a])-CH.indexOf(d.cells[b]) || a-b);
  order.forEach(i=>cell(i, greyOf(d.palette[CH.indexOf(d.cells[i])])));
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = calm ? 0 : 1500, t0 = performance.now();
  let ready = false, shown = 0;
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ ready = true; }, ()=>{ ready = true; });
  function step(now){
    const t = DUR ? Math.min(1, (now-t0)/DUR) : 1, n = Math.floor(t*order.length);
    for(;shown<n;shown++){ const i = order[shown]; cell(i, d.palette[CH.indexOf(d.cells[i])]); }
    $("spFill").style.width = (t*100)+"%";
    if(t<1 || (!ready && now-t0<3000)) requestAnimationFrame(step);
    else { sp.classList.add("gone"); setTimeout(()=>sp.remove(), 450); }
  }
  requestAnimationFrame(step);
})();
</script>
</body>
