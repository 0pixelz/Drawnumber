<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coloriage">
<meta name="theme-color" content="#1d1b3a">
<title>Coloriage par numéros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Plan : bandeau encre marine avec frise de pixels, cartes « autocollant » à ombre franche, une couleur par catégorie.
   Téléphone : une colonne. Tablette : catégories en colonne à gauche, grille à droite ; en jeu, palette sur le côté en paysage. */
:root{
  color-scheme: light;
  --paper:#f3f1fa;
  --card:#ffffff;
  --ink:#1d1b3a;
  --muted:#6d6a8c;
  --line:#dcd8ee;
  --accent:#c81fd0;
  --accent-ink:#ffffff;
  --good:#1c9a5b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{height:100%;display:none;flex-direction:column}
.view.on{display:flex}
canvas{image-rendering:pixelated}

/* Écran de chargement */
#splash{position:fixed;inset:0;z-index:10;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .4s}
#splash.gone{opacity:0;pointer-events:none}
#splashCv{width:min(52vw,208px);height:auto;aspect-ratio:1;border-radius:22px;border:4px solid #fff;background:#2c2a55}
.sp-t{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.sp-bar{width:min(60vw,240px);height:10px;border-radius:10px;background:#3a3769;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#ff6fae;border-radius:10px}
.sp-s{font-weight:700;font-size:14px;color:#cfcbe8}

/* Accueil : tiroir de catégories (masquable) + contenu */
#home{overflow:hidden}
.shell{flex:1;min-height:0;display:flex;position:relative}
#drawer{flex:0 0 276px;width:276px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:16px;padding:calc(14px + var(--st)) 14px calc(16px + var(--sb)) calc(14px + var(--sl));overflow-y:auto;z-index:4;position:absolute;inset:0 auto 0 0;transform:translateX(-104%);box-shadow:8px 0 30px rgba(0,0,0,.25)}
body.drawer-open #drawer{transform:none}
#scrim{position:absolute;inset:0;background:rgba(29,27,58,.55);opacity:0;pointer-events:none;z-index:3}
body.drawer-open #scrim{opacity:1;pointer-events:auto}
.dr-h{display:flex;align-items:center;gap:10px}
#logo{width:46px;height:46px;border-radius:12px;border:3px solid #fff;flex:0 0 auto}
.dr-h b{flex:1;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.02}
.icon{flex:0 0 auto;width:44px;height:44px;border-radius:13px;border:0;background:#322f61;color:#fff;display:grid;place-items:center;padding:0}
.icon svg{width:22px;height:22px;display:block}
.icon:active{transform:translateY(1px)}
.dr-l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a9a4d0;margin:2px 4px -8px}
#nav{display:flex;flex-direction:column;gap:6px}
.nv{--c:#322f61;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#fff;border-radius:15px;padding:7px 10px 7px 7px;text-align:left;width:100%}
.nv canvas,.nv .ic{width:42px;height:42px;border-radius:11px;flex:0 0 auto;background:var(--c);display:grid;place-items:center}
.nv .ic svg{width:22px;height:22px}
.nv b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;display:block}
.nv small{font-size:12px;font-weight:800;color:#b9b5db;font-variant-numeric:tabular-nums}
.nv.on{background:var(--c)}
.nv.on small{color:#fff}
.nv.on canvas,.nv.on .ic{box-shadow:0 0 0 2px #fff}
.dr-f{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.overall{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#cfcbe8;font-variant-numeric:tabular-nums}
.overall .bar{background:#3a3769;height:8px}
.overall .bar i{background:#ff6fae}
.content{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.content>*{flex:0 0 auto}
.appbar{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--st)) calc(14px + var(--sr)) 10px calc(14px + var(--sl))}
.ab-t{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#322f61;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pix{height:8px;background:repeating-linear-gradient(90deg,#d6336c 0 10px,#3b5bdb 10px 20px,#e8590c 20px 30px,#2f9e44 30px 40px,#0c8599 40px 50px,#7048e8 50px 60px);position:sticky;top:calc(64px + var(--st));z-index:2}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 #8d1493}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8d1493}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.small{padding:8px 12px;border-radius:12px;font-size:14px}
.btn.pink{background:#ff6fae;color:var(--ink);box-shadow:0 3px 0 #b83a78}
.btn.pink:active{box-shadow:0 1px 0 #b83a78}
.btn.line{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink);border:2px solid var(--ink)}
.btn.line:active{box-shadow:0 1px 0 var(--ink)}

.page{max-width:1080px;width:100%;margin:0 auto;padding:20px calc(16px + var(--sr)) calc(40px + var(--sb)) calc(16px + var(--sl));display:flex;flex-direction:column;gap:24px}
.block{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.1;margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.feature{--c:var(--accent);background:var(--card);border:2px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:12px;display:grid;grid-template-columns:minmax(104px,34%) 1fr;gap:14px;align-items:center;cursor:pointer}
.feature canvas{width:100%;aspect-ratio:1;border-radius:14px;background:#eceaf5;display:block}
.feature .fx{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start}
.feature h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;margin:0}
.feature .bar{width:100%;height:8px}
.feature .inf{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.quick .btn{flex:1 1 150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.tile{--c:#888;background:var(--c);color:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:9px;display:flex;flex-direction:column;gap:7px;text-align:left}
.tile canvas{width:100%;aspect-ratio:1;border-radius:13px;background:#ffffff33;display:block}
.tile b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05}
.tile small{font-size:12px;font-weight:800;opacity:.92;font-variant-numeric:tabular-nums}
.tile .bar{background:#ffffff4d}
.tile .bar i{background:#fff}
.tile:active,.feature:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sec{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.sec .lh{display:flex;align-items:center;gap:10px;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fl{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--muted)}
.fl.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rowscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rowscroll::-webkit-scrollbar{display:none}
.rowscroll .card{flex:0 0 138px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px}
.card{--c:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:7px;text-align:left;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.th{position:relative}
.th canvas{width:100%;aspect-ratio:1;border-radius:11px;background:#eceaf5;display:block}
.badge{position:absolute;right:6px;top:6px;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:var(--ink);color:#fff;font-variant-numeric:tabular-nums}
.card.done .badge{background:var(--good)}
.card .nm{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.card.done .bar i{background:var(--good)}
.del{border:0;background:none;color:var(--muted);font-weight:800;font-size:12px;padding:2px 0;text-decoration:underline}
.empty{grid-column:1/-1;color:var(--muted);font-weight:700;padding:12px 0;margin:0}
@media (hover:hover){.card:hover,.tile:hover,.feature:hover{transform:translateY(-2px)} .nv:hover{background:#322f61} .nv.on:hover{background:var(--c)}}
@media (min-width:700px){
  .ab-t{font-size:26px}
  .page{gap:28px;padding-top:26px}
  .feature{grid-template-columns:200px 1fr;gap:22px;padding:16px}
  .feature h3{font-size:32px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px}
  .rowscroll .card{flex-basis:164px}
  .rowscroll{margin:0;padding:2px 2px 8px}
}
@media (min-width:900px){
  #drawer{position:static;transform:none;box-shadow:none}
  body.drawer-off #drawer{display:none}
  #scrim{display:none}
  #drawerClose{display:none}
}
@media (prefers-reduced-motion:no-preference){#drawer{transition:transform .22s ease} #scrim{transition:opacity .22s}}

/* Jeu */
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) calc(12px + var(--sr)) 10px calc(12px + var(--sl));background:var(--card);border-bottom:2px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.btn.sq{padding:7px 9px;display:grid;place-items:center}
.btn.sq svg{width:22px;height:22px;display:block}
.top{gap:8px}
.top .ttl b{font-family:var(--display);font-size:19px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;min-width:0;position:relative;touch-action:none;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px,var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
#win{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:none;gap:12px;align-items:center;font-weight:800;white-space:nowrap}
#win.on{display:flex}
.side{display:flex;flex-direction:column;background:var(--card);border-top:2px solid var(--line)}
.tools{display:flex;gap:8px;padding:8px calc(12px + var(--sr)) 0 calc(12px + var(--sl));align-items:center}
.tools .hint{flex:1;color:var(--muted);font-size:13px;font-weight:700;min-width:0}
#pal{display:flex;gap:10px;overflow-x:auto;padding:10px calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));scrollbar-width:none}
#pal::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);font-family:var(--display);font-weight:800;font-size:20px;position:relative;padding:0;font-variant-numeric:tabular-nums}
.chip.sel{box-shadow:0 0 0 3px var(--ink);transform:translateY(-3px)}
.chip.fin{opacity:.35}
.chip small{position:absolute;right:-4px;top:-6px;background:var(--ink);color:#fff;border-radius:10px;font:800 10px var(--body);padding:2px 5px}
@media (min-width:700px){
  .chip{width:62px;height:62px;font-size:24px}
  .chip small{font-size:12px}
  .top .ttl b{font-size:22px}
  .btn.small{padding:10px 14px;font-size:15px}
  #pal{gap:14px;padding-top:14px}
}
@media (min-width:900px) and (orientation:landscape){
  .body{flex-direction:row}
  .side{flex:0 0 calc(252px + var(--sr));border-top:0;border-left:2px solid var(--line);min-height:0}
  .tools{flex-wrap:wrap;padding:14px calc(14px + var(--sr)) 4px 14px}
  .tools .hint{flex:1 0 100%;font-size:15px}
  .tools .btn{flex:1}
  #pal{flex:1;flex-wrap:wrap;align-content:flex-start;overflow-x:hidden;overflow-y:auto;padding:14px calc(14px + var(--sr)) calc(14px + var(--sb)) 14px}
}

/* Import */
#dlg{position:fixed;inset:0;background:rgba(29,27,58,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#dlg.on{display:flex}
.sheet{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{font-size:22px}
.sheet canvas{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#eceaf5}
.row{display:flex;gap:10px}
.row label{flex:1;font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select,input[type=text]{font:inherit;font-weight:700;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card);width:100%}
.err{color:#b3261e;font-weight:700;font-size:14px;margin:0}
@media (prefers-reduced-motion:no-preference){.chip,.card,.cat{transition:transform .12s}}
</style>
</head>
<body>

<div id="splash" role="status">
  <canvas id="splashCv" width="208" height="208"></canvas>
  <div class="sp-t">Coloriage par numéros</div>
  <div class="sp-bar"><i id="spFill"></i></div>
  <div class="sp-s">Préparation des dessins…</div>
</div>

<section id="home" class="view on">
  <div class="shell">
    <div id="scrim"></div>
    <aside id="drawer" aria-label="Menu des catégories">
      <div class="dr-h">
        <canvas id="logo" width="52" height="52"></canvas>
        <b>Coloriage<br>par numéros</b>
        <button class="icon" id="drawerClose" type="button" aria-label="Masquer le menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dr-l">Catégories</div>
      <nav id="nav"></nav>
      <div class="dr-f">
        <div class="overall"><span id="ovTxt"></span><div class="bar"><i id="ovBar"></i></div></div>
        <button class="btn pink" id="importBtn" type="button">Importer une photo</button>
      </div>
    </aside>
    <div class="content" id="content">
      <header class="appbar">
        <button class="icon" id="drawerBtn" type="button" aria-label="Afficher ou masquer les catégories" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="ab-t" id="abTitle"></div>
        <span class="pill" id="ovPill"></span>
      </header>
      <div class="pix"></div>
      <div class="page" id="page"></div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<section id="play" class="view">
  <div class="top">
    <button class="btn ghost small" id="back" type="button">‹ Dessins</button>
    <div class="ttl"><b id="pname"></b><span id="pprog"></span></div>
    <button class="btn ghost small sq" id="snd" type="button"></button>
    <button class="btn ghost small" id="reset" type="button">Recommencer</button>
  </div>
  <div class="body">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="win"><span>Dessin terminé !</span><button class="btn small" id="winBack" type="button">Autre dessin</button></div>
    </div>
    <div class="side">
      <div class="tools">
        <span class="hint" id="hint"></span>
        <button class="btn ghost small" id="find" type="button">Trouver une case</button>
        <button class="btn ghost small" id="fit" type="button">Recentrer</button>
      </div>
      <div id="pal"></div>
    </div>
  </div>
</section>

<div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="sheet">
    <h2 id="dlgT">Nouvelle image</h2>
    <canvas id="prev"></canvas>
    <p class="err" id="ierr" hidden></p>
    <label style="font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:4px">Nom
      <input type="text" id="iname" maxlength="30" value="Ma photo"></label>
    <div class="row">
      <label>Taille
        <select id="isize"><option value="24">24 cases</option><option value="32" selected>32 cases</option><option value="48">48 cases</option><option value="64">64 cases</option></select></label>
      <label>Couleurs
        <select id="icol"><option>6</option><option>8</option><option selected>12</option><option>16</option><option>20</option><option>24</option></select></label>
    </div>
    <div class="row">
      <button class="btn ghost" id="icancel" type="button" style="flex:1">Annuler</button>
      <button class="btn" id="iok" type="button" style="flex:1">Créer le dessin</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const CH = "0123456789abcdefghijklmnopqrstuvwxyz";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const lum = h => { const [r,g,b] = rgb(h); return (.299*r+.587*g+.114*b)/255; };
const hex2 = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");
const mix = (a,b,t) => { const A=rgb(a), B=rgb(b); return "#"+A.map((v,i)=>hex2(v+(B[i]-v)*t)).join(""); };
function hsl(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return "#"+hex2(f(0)*255)+hex2(f(8)*255)+hex2(f(4)*255); }

/* ---------- Dessins intégrés (générés par formules) ---------- */
function gen(id, name, cols, rows, palette, fn){
  let cells = "";
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) cells += CH[fn(x+.5, y+.5)];
  return {id, name, cols, rows, palette, cells};
}
const H = Math.hypot;
function edge(inside, x, y){ return inside(x,y) && !(inside(x-1,y)&&inside(x+1,y)&&inside(x,y-1)&&inside(x,y+1)); }

const BUILTIN = [
  gen("coeur","Cœur",18,18,["#ffd9e6","#e5273f","#8f1027","#ff8fa3","#ffffff"],(px,py)=>{

/* Générateur à partir de couleurs : la palette se construit toute seule */
function genHex(id, name, cat, cols, rows, fn){
  const palette = []; let cells = "";
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const h = fn(x+.5, y+.5); let i = palette.indexOf(h);
    if(i<0){ i = palette.length; palette.push(h); }
    cells += CH[i];
  }
  return {id, name, cat, cols, rows, palette, cells};
}

function glyph(id, name, cat, ch, hue){
  const g = FONT[ch].replace(/ /g,""), S = 2, pad = 2, cols = 5*S+pad*2, rows = 7*S+pad*2;
  const on = (x,y) => { const gx = Math.floor((x-pad)/S), gy = Math.floor((y-pad)/S); return gx>=0&&gx<5&&gy>=0&&gy<7&&g[gy*5+gx]==="1"; };
  const bg = hsl(hue,85,92), top = hsl(hue,88,64), bot = hsl(hue,82,48), out = hsl(hue,60,22);
  return genHex(id, name, cat, cols, rows, (px,py)=>{
    if(on(px,py)) return py < rows/2 ? top : bot;
    if(on(px-1,py)||on(px+1,py)||on(px,py-1)||on(px,py+1)) return out;
    return bg;
  });
}

const RB = ["#e63946","#ff8c42","#ffc300","#38b000","#3a86ff","#9b5de5","#ff5d8f","#00b4a6"];
function octo(id, name, opt){
  const o = Object.assign({c:"#ff6fae",bg:"mer",eyes:"rond",mouth:"smile",acc:"",arms:6,N:26,spread:3.5,len:8.6,amp:1,freq:2,pose:"",spots:1,rainbow:false}, opt);
  const N = o.N, k = 26/N, dark = mix(o.c,INK,.55), light = mix(o.c,"#ffffff",.45), cheek = mix("#ff7aa8",o.c,.25);
  const pts = [];
  for(let a=0;a<o.arms;a++){
    const f = a/(o.arms-1)*2-1, bx = 13+f*5.6, L = o.len-Math.abs(f)*1.2;
    for(let t=0;t<=1.001;t+=.04){
      let x = bx+f*o.spread*t+o.amp*Math.sin(t*Math.PI*o.freq+a*1.7)*t, y = 14+L*t;
      if(o.pose==="curl"){ x += f*2.4*t*t; y -= 2.2*t*t*Math.abs(f); }
      if(o.pose==="wave" && a===o.arms-1){ x = bx+4.6*t; y = 13.5-7*t+Math.sin(t*6)*.6; }
      pts.push([x, y, 1.3-.5*t, t, a]);
    }
  }
  const head = (x,y) => ((x-13)/7.2)**2+((y-10.3)/6.6)**2<1;
  const tent = (x,y) => { let best=null, bd=0; for(const p of pts){ const d = H(x-p[0],y-p[1])-p[2]; if(d<bd){ bd=d; best=p; } } return best; };
  const inC = (px,py) => head(px*k,py*k) || !!tent(px*k,py*k);
  const SP = o.spots===2 ? [[9.2,6.3,1.2],[16.2,5.9,1],[12.6,5,.8],[7.6,9.6,.8],[18.6,9,.9],[13,7.6,.6],[17,13.4,.8],[8.8,13.6,.7]] : [[9.2,6.3,1.2],[16.2,5.9,.9],[12.6,5.1,.7]];
  function accessory(x,y){
    const ax = Math.abs(x-13);
    if(o.acc==="chapeau"){ if(ax<4.7&&y>=3.3&&y<4.5) return "#2b2b3a"; if(ax<2.9&&y>=.3&&y<3.3) return y>=2.2?"#e63946":"#2b2b3a"; }
    if(o.acc==="fete"){ if(H(x-13,y-.6)<.95) return "#ff5d8f"; if(y>=.6&&y<4.7&&ax<(y-.4)*.66+.2) return Math.floor(y/1.3)%2?"#ffd23f":"#3a86ff"; }
    if(o.acc==="couronne"){
      if(ax<3.8&&y>=2.6&&y<4.5) return H(x-13,y-3.5)<.75?"#e63946":"#ffd23f";
      for(const pk of [9.9,13,16.1]) if(y<2.6&&y>=.5+Math.abs(x-pk)*1.5) return "#ffd23f";
    }
    if(o.acc==="noeud"){ const dx=Math.abs(x-17.4), dy=Math.abs(y-4.7); if(dx<.85&&dy<.85) return "#c9184a"; if(dx<3&&dy<dx*.85+.2) return "#ff4d6d"; }
    if(o.acc==="coeurs") for(const [hx,hy] of [[3.6,3.6],[22.4,3.6],[23,13.5]]){ const X=(x-hx)/1.9, Y=-(y-hy)/1.9+.2, s=X*X+Y*Y-1; if(s*s*s-X*X*Y*Y*Y<0) return "#e63946"; }
    if(o.acc==="etoiles") for(const [sx,sy] of [[3.5,4],[22.5,3],[23.2,12.5],[2.8,13]]) if(Math.abs(x-sx)+Math.abs(y-sy)<1.7) return "#ffd23f";
    return null;
  }
  function face(x,y){
    for(const sg of [-1,1]){
      const dx = x-(13+sg*2.9), dy = y-9.8, d = H(dx,dy);
      if(o.acc==="pirate" && sg<0){ if(d<2.2) return INK; continue; }
      if(o.acc==="lunettes" && Math.abs(d-2.5)<.5) return "#343a40";
      if(o.eyes==="rond"){ if(H(dx-.3,dy-.2)<.95) return INK; if(d<1.9) return "#ffffff"; }
      if(o.eyes==="grand"){ if(H(dx-.3,dy-.3)<1.3) return INK; if(d<2.5) return "#ffffff"; }
      if(o.eyes==="content" && Math.abs(d-1.4)<.5 && dy<.1) return INK;
      if(o.eyes==="dodo" && Math.abs(dy)<.5 && Math.abs(dx)<1.6) return INK;
    }
    if(o.acc==="lunettes" && Math.abs(y-9.8)<.5 && Math.abs(x-13)<.7) return "#343a40";
    if(o.acc==="pirate" && y>=6.9 && y<7.8) return INK;
    if(o.mouth==="smile" && Math.abs(H(x-13,y-11.9)-1.7)<.45 && y>12.7) return dark;
    if(o.mouth==="o" && H(x-13,y-13.7)<.95) return INK;
    if(H(x-8,y-12.4)<1.05 || H(x-18,y-12.4)<1.05) return cheek;
    if(o.spots) for(const [sx,sy,sr] of SP) if(H(x-sx,y-sy)<sr) return light;
    return o.c;
  }
  function back(x,y){
    if(o.bg==="uni") return o.bgc || "#fff3bf";
    if(o.bg==="nuit"){
      const h = Math.sin(Math.floor(x/k)*12.9898+Math.floor(y/k)*78.233)*43758.5453;
      if(y>=23.6) return "#0b132b";
      return h-Math.floor(h)>.95 ? "#7de2d1" : "#14213d";
    }
    if(y>=23.6) return "#f2d58a";
    if(y>15 && (Math.abs(x-2.2-Math.sin(y*1.3)*.6)<.7 || Math.abs(x-23.8-Math.sin(y*1.3+2)*.6)<.7)) return "#2f9e44";
    for(const [bx,by,br] of [[3.5,6,1],[5.2,3,.7],[22,8,.9],[20.5,2.5,.6]]) if(H(x-bx,y-by)<br) return "#c9efff";
    if(o.bg==="rayons") return y>13 ? "#2b8fd0" : "#7cc6f2";
    return "#3aa7e0";
  }
  BUILTIN.push(genHex("O_"+id, name, "pieuvres", N, N, (px,py)=>{
    const x = px*k, y = py*k;
    const a = accessory(x,y); if(a) return a;
    if(!inC(px,py)) return back(x,y);
    if(edge(inC,px,py)) return dark;
    if(head(x,y)) return face(x,y);
    const p = tent(x,y), base = o.rainbow ? RB[p[4]%RB.length] : o.c;
    return p[3]>.7 ? mix(base,"#ffffff",.42) : base;
  }));
}

let actx = null, muted = store.get("cpn.mute", false), lastS = 0, combo = 0, comboT = 0;

function audio(){

    if(!actx){ const A = window.AudioContext || window.webkitAudioContext; if(!A) return null; actx = new A(); }

const SCALE = [0,2,4,7,9,12,14,16,19,21,24];
function sPaint(){

function sColor(){ const a = audio(); if(!a) return; [783.99,1046.5,1318.5].forEach((f,i)=>tone(f, a.currentTime+i*.08, .25, .12, "sine")); }

const SND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

let sparks = [];
function sparkle(i, delay){ if(calmFx) return; if(sparks.length > 140) sparks.shift(); sparks.push({i, t0: performance.now()+(delay||0), rot: Math.random()*1.5}); }

/* ---------- Jeu ---------- */
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let cur=null, done=null, idx=null, sel=0, left=[], view={s:20,x:0,y:0}, W=0, Hh=0, dpr=1, raf=0;

function show(v){ $("home").classList.toggle("on", v==="home"); $("play").classList.toggle("on", v==="play"); }
function openDrawing(d){
  sparks = []; cur = d; done = loadDone(d); store.set("cpn.last", d.id);
  idx = new Int8Array(d.cells.length);
  left = d.palette.map(()=>0);
  for(let i=0;i<d.cells.length;i++){
    idx[i] = d.cells[i]==="." ? -1 : CH.indexOf(d.cells[i]);
    if(idx[i]>=0 && !done[i]) left[idx[i]]++;
  }
  sel = Math.max(0, left.findIndex(n=>n>0));
  $("pname").textContent = d.name;
  show("play"); resize(); fit(); buildPalette(); updateProg();
}
function resize(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio||1, 3);
  W = r.width; Hh = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(Hh*dpr);
  if(fitted && cur) fit(); else draw();
}
function fitScale(){ return Math.min(W/cur.cols, Hh/cur.rows)*.94; }
let fitted = true;
function fit(){ fitted = true; view.s = fitScale(); view.x = (W-cur.cols*view.s)/2; view.y = (Hh-cur.rows*view.s)/2; draw(); }
function clampView(){
  const w = cur.cols*view.s, h = cur.rows*view.s, m = 60;

  const y0 = Math.max(0, Math.floor(-view.y/s)), y1 = Math.min(rows, Math.ceil((Hh-view.y)/s));
  const nums = s >= 13;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `800 ${Math.min(22, s*.5)}px Nunito, system-ui, sans-serif`;
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const i = y*cols+x, p = idx[i]; if(p<0) continue;
    const X = view.x+x*s, Y = view.y+y*s, col = cur.palette[p];
    if(done[i]){ ctx.fillStyle = col; ctx.fillRect(X-.3, Y-.3, s+.6, s+.6); continue; }
    const hot = p===sel;
    ctx.fillStyle = hot ? "#8f8aa8" : greyOf(col);
    ctx.fillRect(X, Y, s, s);
    ctx.strokeStyle = "rgba(29,27,58,.14)"; ctx.lineWidth = 1;
    ctx.strokeRect(X+.5, Y+.5, s-1, s-1);
    if(nums){ ctx.fillStyle = hot ? "#fff" : "rgba(29,27,58,.62)"; ctx.fillText(p+1, X+s/2, Y+s/2+1); }
  }

function buildPalette(){

    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.id = "chip"+i;
    b.style.background = col; b.style.color = lum(col) > .6 ? "#1d1b3a" : "#fff";
    b.onclick = () => selectColor(i, false);
    pal.appendChild(b);
  });

}
function refreshChips(){
  cur.palette.forEach((col,i)=>{
    const b = $("chip"+i); if(!b) return;
    b.className = "chip" + (i===sel ? " sel" : "") + (left[i]===0 ? " fin" : "");
    b.textContent = left[i]===0 ? "✓" : i+1;
    b.setAttribute("aria-label", `Couleur ${i+1}, ${left[i]} cases restantes`);

function selectColor(i, scroll){

let saveT = 0;
function paintCell(i){

    const cellsIdx = []; for(let j=0;j<idx.length;j++) if(idx[j]>=0) cellsIdx.push(j);

/* Gestes : glisser sur une case de la couleur choisie = peindre ; ailleurs = déplacer ; deux doigts = zoom */

stage.addEventListener("pointerdown", e=>{
  if(e.target.closest("#win")) return;
  stage.setPointerCapture(e.pointerId); audio();

  if(pts.size===1){
    moved = 0;
    const i = cellAt(p.x,p.y);

    if(mode==="paint") paintCell(i);
  } else if(pts.size===2){

    const [a,b] = [...pts.values()];
    const d = H(a.x-b.x,a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    zoomTo(pinch.s*d/pinch.d, pinch.mx, pinch.my, pinch.vx, pinch.vy, pinch.s);
    view.x += mx-pinch.mx; view.y += my-pinch.my; clampView(); draw();
  }
});
function endPtr(e){
  if(!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId); pts.delete(e.pointerId);
  if(mode==="pan" && moved<8 && e.type==="pointerup"){
    const i = cellAt(p.x,p.y);
    if(i>=0 && idx[i]>=0 && !done[i] && idx[i]!==sel) selectColor(idx[i], true);
  }
  if(pts.size===0) mode = ""; else if(mode==="pinch") mode = "wait";
}
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
function zoomTo(ns, cx, cy, vx=view.x, vy=view.y, os=view.s){
  fitted = false;
  const f = fitScale(); ns = Math.max(f*.7, Math.min(90, ns));
  view.x = cx-(cx-vx)*ns/os; view.y = cy-(cy-vy)*ns/os; view.s = ns;
}
stage.addEventListener("wheel", e=>{
  e.preventDefault(); const p = pos(e);
  zoomTo(view.s*Math.exp(-e.deltaY*.0015), p.x, p.y); clampView(); draw();
}, {passive:false});

$("fit").onclick = fit;
$("find").onclick = () => {
  if(left[sel]===0) return;
  let best=-1, bd=1e9; const cx=(W/2-view.x)/view.s, cy=(Hh/2-view.y)/view.s;
  for(let i=0;i<idx.length;i++) if(idx[i]===sel && !done[i]){
    const d = H(i%cur.cols+.5-cx, Math.floor(i/cur.cols)+.5-cy); if(d<bd){ bd=d; best=i; }
  }
  fitted = false; view.s = Math.max(view.s, 34);
  view.x = W/2-(best%cur.cols+.5)*view.s; view.y = Hh/2-(Math.floor(best/cur.cols)+.5)*view.s;
  clampView(); draw();
};
function goHome(){ if(cur){ saveDone(cur, done); } cur = null; renderGallery(); show("home"); }
$("back").onclick = goHome; $("winBack").onclick = goHome;
const rs = $("reset");
rs.onclick = () => {
  if(rs.dataset.sure){ delete rs.dataset.sure; rs.textContent = "Recommencer"; store.del("cpn.p."+cur.id); openDrawing(cur); }
  else { rs.dataset.sure = 1; rs.textContent = "Tout effacer ?"; setTimeout(()=>{ delete rs.dataset.sure; rs.textContent = "Recommencer"; }, 3000); }
};
window.addEventListener("resize", ()=>{ if(cur) resize(); });
if(window.ResizeObserver) new ResizeObserver(()=>{ if(cur) resize(); }).observe(stage);
for(const ev of ["gesturestart","gesturechange"]) document.addEventListener(ev, e=>e.preventDefault());

/* ---------- Import d'une photo ---------- */
let srcImg = null, pending = null;
$("importBtn").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { srcImg = im; $("iname").value = (f.name||"Ma photo").replace(/\.[^.]+$/,"").slice(0,30) || "Ma photo"; $("ierr").hidden = true; $("dlg").classList.add("on"); convert(); };
  im.onerror = () => { $("ierr").textContent = "Cette image ne peut pas être lue. Essaie un fichier JPG ou PNG."; $("ierr").hidden = false; $("dlg").classList.add("on"); };
  im.src = url;
};
function convert(){
  if(!srcImg) return;
  const size = +$("isize").value, k = +$("icol").value;
  const r = srcImg.naturalWidth/srcImg.naturalHeight;
  const cols = r>=1 ? size : Math.max(4, Math.round(size*r)), rows = r>=1 ? Math.max(4, Math.round(size/r)) : size;
  const t = document.createElement("canvas"); t.width = cols; t.height = rows;
  const c = t.getContext("2d", {willReadFrequently:true});
  c.imageSmoothingQuality = "high"; c.drawImage(srcImg, 0, 0, cols, rows);
  const px = c.getImageData(0,0,cols,rows).data, n = cols*rows;
  const pix = []; for(let i=0;i<n;i++) if(px[i*4+3]>=128) pix.push(i);
  if(!pix.length) return;
  // k-moyennes, graines réparties selon la luminosité
  const sorted = pix.slice().sort((a,b)=>(px[a*4]*.299+px[a*4+1]*.587+px[a*4+2]*.114)-(px[b*4]*.299+px[b*4+1]*.587+px[b*4+2]*.114));
  let cen = []; for(let j=0;j<k;j++){ const i = sorted[Math.floor((j+.5)/k*sorted.length)]; cen.push([px[i*4],px[i*4+1],px[i*4+2]]); }
  const asg = new Int16Array(n).fill(-1);
  for(let it=0;it<10;it++){
    const sum = cen.map(()=>[0,0,0,0]);
    for(const i of pix){
      let b=0, bd=1e12;
      for(let j=0;j<cen.length;j++){ const dr=px[i*4]-cen[j][0], dg=px[i*4+1]-cen[j][1], db=px[i*4+2]-cen[j][2], d=dr*dr*.3+dg*dg*.59+db*db*.11; if(d<bd){ bd=d; b=j; } }
      asg[i] = b; const s = sum[b]; s[0]+=px[i*4]; s[1]+=px[i*4+1]; s[2]+=px[i*4+2]; s[3]++;
    }
    cen = cen.map((cc,j)=> sum[j][3] ? [sum[j][0]/sum[j][3], sum[j][1]/sum[j][3], sum[j][2]/sum[j][3]] : cc);
  }
  const used = [...new Set(pix.map(i=>asg[i]))];
  const hex = v => Math.round(v).toString(16).padStart(2,"0");
  const palette = [], map = {};
  for(const j of used){ const h = "#"+hex(cen[j][0])+hex(cen[j][1])+hex(cen[j][2]); let at = palette.indexOf(h); if(at<0){ at = palette.length; palette.push(h); } map[j] = at; }
  let cells = ""; for(let i=0;i<n;i++) cells += asg[i]<0 ? "." : CH[map[asg[i]]];
  pending = {cols, rows, palette, cells};
  const pv = $("prev"), z = Math.max(1, Math.floor(360/Math.max(cols,rows)));
  pv.width = cols*z; pv.height = rows*z; const pc = pv.getContext("2d");
  for(let i=0;i<n;i++){ if(asg[i]<0) continue; pc.fillStyle = palette[map[asg[i]]]; pc.fillRect((i%cols)*z, Math.floor(i/cols)*z, z, z); }
}
$("isize").onchange = convert; $("icol").onchange = convert;
function closeDlg(){ $("dlg").classList.remove("on"); srcImg = null; pending = null; }
$("icancel").onclick = closeDlg;
$("iok").onclick = () => {
  if(!pending){ closeDlg(); return; }
  const d = Object.assign({id:"c"+Date.now().toString(36), name:$("iname").value.trim()||"Ma photo", custom:true}, pending);
  customs.push(d); store.set("cpn.custom", customs);
  closeDlg(); page = "photos"; store.set("cpn.page", page); openDrawing(d);
};

renderGallery();

/* ---------- Écran de chargement ---------- */
(function(){
  const sp = $("splash"), d = BUILTIN.find(x=>x.id==="O_rose");
  const lg = $("logo"); drawThumb(lg, d, null, true);
  const cvs = $("splashCv"), c = cvs.getContext("2d"), k = cvs.width/d.cols;
  const cell = (i, col) => { c.fillStyle = col; c.fillRect((i%d.cols)*k, Math.floor(i/d.cols)*k, k, k); };
  const order = [...d.cells].map((ch,i)=>i).sort((a,b)=>CH.indexOf(d.cells[a])-CH.indexOf(d.cells[b]) || a-b);
  order.forEach(i=>cell(i, greyOf(d.palette[CH.indexOf(d.cells[i])])));
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = calm ? 0 : 1500, t0 = performance.now();
  let ready = false, shown = 0;
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ ready = true; }, ()=>{ ready = true; });
  function step(now){
    const t = DUR ? Math.min(1, (now-t0)/DUR) : 1, n = Math.floor(t*order.length);
    for(;shown<n;shown++){ const i = order[shown]; cell(i, d.palette[CH.indexOf(d.cells[i])]); }
    $("spFill").style.width = (t*100)+"%";
    if(t<1 || (!ready && now-t0<3000)) requestAnimationFrame(step);
    else { sp.classList.add("gone"); setTimeout(()=>sp.remove(), 450); }
  }
  requestAnimationFrame(step);
})();
</script>
